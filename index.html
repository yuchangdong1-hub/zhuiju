<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="追剧记录">
<meta name="theme-color" content="#0d0f14">
<title>追剧记录</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230d0f14'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='%23f5b942'%3E%E5%89%A7%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0d0f14; --card:#171a21; --card2:#1e222b; --line:#2a2f3a;
    --text:#f2f3f5; --muted:#9aa0ae; --gold:#f5b942; --gold-d:#c98f1f;
    --green:#3ddc84; --red:#ff6b6b; --radius:14px;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    min-height:100vh; padding-top:var(--sat); padding-bottom:calc(var(--sab) + 96px);
  }
  header{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(10px + var(--sat)) 18px 10px;
    background:rgba(13,15,20,.92); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
    margin-top:calc(-1 * var(--sat));
  }
  header h1{font-size:20px; margin:0; font-weight:700; letter-spacing:1px;}
  header h1 .dot{color:var(--gold);}
  .icon-btn{
    width:40px; height:40px; border-radius:50%; border:1px solid var(--line);
    background:var(--card); color:var(--text); font-size:19px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:active{transform:scale(.94);}
  main{padding:14px 14px 0; max-width:640px; margin:0 auto;}
  .card{
    display:flex; gap:12px; background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius); padding:12px; margin-bottom:12px; position:relative;
  }
  .card.done{opacity:.62;}
  .poster{
    width:74px; height:110px; border-radius:8px; object-fit:cover; flex-shrink:0;
    background:var(--card2); border:1px solid var(--line);
  }
  .poster.ph{display:flex; align-items:center; justify-content:center; font-size:26px; color:var(--muted);}
  .info{flex:1; min-width:0; display:flex; flex-direction:column;}
  .row1{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
  .name{font-size:16px; font-weight:700; margin:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .menu-btn{background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; padding:0 4px; line-height:1;}
  .ep{margin:6px 0 2px; font-size:13px; color:var(--muted);}
  .ep b{color:var(--gold); font-size:22px; margin:0 2px;}
  .badge{font-size:11px; padding:2px 8px; border-radius:20px; border:1px solid var(--line); color:var(--muted); white-space:nowrap;}
  .badge.watching{color:var(--gold); border-color:var(--gold-d);}
  .badge.done{color:var(--green); border-color:var(--green);}
  .stepper{margin-top:auto; display:flex; gap:10px; align-items:center; padding-top:8px;}
  .step-btn{
    flex:1; height:40px; border-radius:10px; border:1px solid var(--line);
    background:var(--card2); color:var(--text); font-size:17px; font-weight:700; cursor:pointer;
  }
  .step-btn.plus{background:var(--gold); border-color:var(--gold); color:#1a1206;}
  .step-btn:active{transform:scale(.96);}
  .empty{margin:60px 20px; text-align:center; color:var(--muted);}
  .empty .big{font-size:44px; margin-bottom:12px;}
  .empty p{line-height:1.8; font-size:14px;}
  .fab{
    position:fixed; right:20px; bottom:calc(24px + var(--sab)); z-index:30;
    width:60px; height:60px; border-radius:50%; border:none; cursor:pointer;
    background:var(--gold); color:#1a1206; font-size:30px; font-weight:700; line-height:1;
    box-shadow:0 8px 24px rgba(245,185,66,.35);
  }
  .fab:active{transform:scale(.93);}
  dialog{
    border:1px solid var(--line); background:var(--card); color:var(--text);
    border-radius:18px; padding:20px; width:calc(100vw - 48px); max-width:440px;
  }
  dialog::backdrop{background:rgba(0,0,0,.6); backdrop-filter:blur(3px);}
  dialog h2{margin:0 0 14px; font-size:17px;}
  dialog input[type=text], dialog input[type=number]{
    width:100%; padding:12px 14px; font-size:16px; border-radius:10px;
    border:1px solid var(--line); background:var(--bg); color:var(--text); margin-bottom:10px;
  }
  dialog input:focus{outline:2px solid var(--gold-d); border-color:var(--gold);}
  .btn-row{display:flex; gap:10px; margin-top:6px;}
  .btn{
    flex:1; padding:12px; border-radius:10px; font-size:15px; font-weight:700; cursor:pointer; border:1px solid var(--line);
    background:var(--card2); color:var(--text);
  }
  .btn.primary{background:var(--gold); border-color:var(--gold); color:#1a1206;}
  .btn.danger{background:none; color:var(--red); border-color:var(--red);}
  .btn:active{transform:scale(.97);}
  .search-results{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:10px 0; max-height:44vh; overflow-y:auto;}
  .sr-item{cursor:pointer; border-radius:10px; border:2px solid transparent; overflow:hidden; background:var(--bg);}
  .sr-item.sel{border-color:var(--gold);}
  .sr-item img{width:100%; aspect-ratio:2/3; object-fit:cover; display:block; background:var(--card2);}
  .sr-item .t{font-size:11px; padding:6px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .hint{font-size:12px; color:var(--muted); line-height:1.7; margin:8px 0;}
  .hint a{color:var(--gold);}
  .hint ol{margin:6px 0; padding-left:20px;}
  #toast{
    position:fixed; top:calc(70px + var(--sat)); left:50%; transform:translateX(-50%) translateY(-16px);
    z-index:50; background:#22262f; border:1px solid var(--gold-d); color:var(--text);
    padding:12px 20px; border-radius:30px; font-size:14px; font-weight:600;
    opacity:0; pointer-events:none; transition:all .25s ease; max-width:calc(100vw - 40px); text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  #toast .ok{color:var(--green); margin-right:6px;}
  .foot{margin:26px 0 6px; text-align:center; font-size:11px; color:#5a606c;}
</style>
</head>
<body>
<header>
  <h1>追剧记录<span class="dot">.</span></h1>
  <button class="icon-btn" id="settingsBtn" aria-label="设置">⚙️</button>
</header>
<main id="list"></main>
<div class="foot">数据只保存在本机浏览器 · 换手机/清缓存会丢失</div>
<button class="fab" id="addBtn" aria-label="添加新剧">＋</button>

<dialog id="addDialog">
  <h2>追一部新剧</h2>
  <input type="text" id="newName" placeholder="输入剧名，如：三体" autocomplete="off">
  <div class="btn-row">
    <button class="btn" id="searchPosterBtn">🔍 搜海报</button>
  </div>
  <div class="search-results" id="searchResults"></div>
  <div class="hint" id="noKeyHint" style="display:none">还没填 TMDB Key，搜不到海报。可以 <a href="#" id="goSettings">去设置里填写</a>（免费注册 2 分钟），或直接添加、以后手动换海报。</div>
  <div class="btn-row">
    <button class="btn" id="addCancel">取消</button>
    <button class="btn primary" id="addConfirm">添加</button>
  </div>
</dialog>

<dialog id="editDialog">
  <h2 id="editTitle">设置</h2>
  <div id="editBody"></div>
  <div class="btn-row">
    <button class="btn" id="editCancel">取消</button>
    <button class="btn primary" id="editConfirm">确定</button>
  </div>
</dialog>

<dialog id="settingsDialog">
  <h2>设置</h2>
  <div class="hint">自动匹配海报需要 TMDB 的免费 API Key（剧名搜海报用，只存本机）：</div>
  <div class="hint"><ol>
    <li>打开 <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">themoviedb.org</a> 注册并登录</li>
    <li>进 <a href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener">设置 → API</a>，按提示申请（选 Developer）</li>
    <li>把 <b>API Key (v3)</b> 复制下来，粘到下面 👇</li>
  </ol></div>
  <input type="text" id="tmdbKey" placeholder="粘贴 TMDB API Key (v3)" autocomplete="off">
  <div class="btn-row">
    <button class="btn" id="settingsCancel">取消</button>
    <button class="btn primary" id="settingsSave">保存</button>
  </div>
</dialog>

<div id="toast" role="status"></div>

<script>
'use strict';
//__PURE_START__
/* 以下为纯逻辑函数（不依赖 DOM），供快捷指令入口与自测使用 */
const LS_KEY = 'zhuiju.v1';

function loadState(){
  try{
    const d = JSON.parse(localStorage.getItem(LS_KEY));
    if(d && Array.isArray(d.shows)) { if(typeof d.tmdbKey!=='string') d.tmdbKey=''; return d; }
  }catch(e){}
  return { shows:[], tmdbKey:'' };
}
function saveState(d){ localStorage.setItem(LS_KEY, JSON.stringify(d)); }
function uid(){ return 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function normName(n){ return (n||'').trim(); }
function findShow(d, name){
  const n = normName(name);
  if(!n) return null;
  return d.shows.find(s => s.name === n) || null;
}
/* 解析快捷指令打开的 URL 参数，如 ?action=set&show=三体&ep=5 */
function parseActionParams(search){
  try{
    const q = new URLSearchParams(search);
    const action = q.get('action');
    const show = normName(q.get('show'));
    if(!action || !show) return null;
    if(!['start','set','done'].includes(action)) return null;
    let ep = null;
    if(action === 'set'){
      ep = parseInt(q.get('ep'), 10);
      if(isNaN(ep) || ep < 0 || ep > 9999) return null;
    }
    return { action, show, ep };
  }catch(e){ return null; }
}
/* 在 state 上应用一条快捷指令动作，返回提示文案；会持久化 */
function applyAction(d, p){
  let s = findShow(d, p.show);
  let created = false;
  if(!s){
    s = { id: uid(), name: p.show, ep: 0, status: 'watching', poster: '', updatedAt: Date.now() };
    d.shows.unshift(s); created = true;
  }
  let msg;
  if(p.action === 'start'){
    if(s.ep < 1) s.ep = 1;
    s.status = 'watching';
    msg = created ? ('已开始追《'+s.name+'》，记为第 1 集') : ('《'+s.name+'》当前看到第 '+s.ep+' 集');
  }else if(p.action === 'set'){
    s.ep = p.ep; s.status = 'watching';
    msg = '已记录《'+s.name+'》第 '+s.ep+' 集';
  }else{ /* done */
    s.status = 'done';
    msg = '《'+s.name+'》已标记看完 🎉';
  }
  s.updatedAt = Date.now();
  saveState(d);
  return msg;
}
//__PURE_END__
</script>
<script>
'use strict';
/* 以下为界面逻辑，仅在浏览器中执行 */
if(typeof document !== 'undefined'){
(function(){
  const $ = id => document.getElementById(id);
  const listEl=$('list'), toastEl=$('toast');
  let state = loadState();
  let toastTimer=null;

  function toast(msg, ms){
    toastEl.innerHTML='<span class="ok">✓</span>'+escapeHtml(msg);
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>toastEl.classList.remove('show'), ms||2600);
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function escAttr(s){ return escapeHtml(s).replace(/\n/g,' '); }

  function statusBadge(s){
    return s.status==='done'
      ? '<span class="badge done">已看完</span>'
      : '<span class="badge watching">在追</span>';
  }
  function posterHtml(s){
    return s.poster
      ? '<img class="poster" src="'+escAttr(s.poster)+'" alt="海报" loading="lazy" onerror="this.outerHTML=\'<div class=&quot;poster ph&quot;>🎬</div>\'">'
      : '<div class="poster ph">🎬</div>';
  }
  function render(){
    if(!state.shows.length){
      listEl.innerHTML='<div class="empty"><div class="big">📺</div><p>还没在追的剧<br>点右下角 ＋ 添加一部吧<br>也可以直接喊 Siri：「开始追剧」</p></div>';
      return;
    }
    listEl.innerHTML = state.shows.map(s=>
      '<div class="card'+(s.status==='done'?' done':'')+'" data-id="'+s.id+'">'+
        posterHtml(s)+
        '<div class="info">'+
          '<div class="row1"><p class="name">'+escapeHtml(s.name)+'</p>'+
          '<button class="menu-btn" data-act="menu" aria-label="更多">⋯</button></div>'+
          '<div class="ep">看到第<b>'+s.ep+'</b>集 '+statusBadge(s)+'</div>'+
          '<div class="stepper">'+
            '<button class="step-btn" data-act="dec" aria-label="减一集">−</button>'+
            '<button class="step-btn plus" data-act="inc" aria-label="加一集">＋ 看完一集</button>'+
          '</div>'+
        '</div>'+
      '</div>').join('');
  }
  function getShow(id){ return state.shows.find(s=>s.id===id); }
  function touch(id){ const s=getShow(id); if(s){ s.updatedAt=Date.now(); saveState(state); } }

  listEl.addEventListener('click', e=>{
    const btn=e.target.closest('button'); if(!btn) return;
    const card=e.target.closest('.card'); if(!card) return;
    const s=getShow(card.dataset.id); if(!s) return;
    const act=btn.dataset.act;
    if(act==='inc'){ s.ep++; s.status='watching'; touch(s.id); render(); }
    else if(act==='dec'){ if(s.ep>0){ s.ep--; touch(s.id); render(); } }
    else if(act==='menu'){ openEdit(s); }
  });

  /* ---- 通用编辑框 ---- */
  const editDialog=$('editDialog'), editTitle=$('editTitle'), editBody=$('editBody');
  let editTarget=null, editMode=null;
  function openEdit(s){
    editTarget=s; editMode='menu';
    editTitle.textContent='《'+s.name+'》';
    editBody.innerHTML=
      '<div class="btn-row" style="flex-direction:column">'+
      '<button class="btn" data-m="setep">✏️ 直接设置集数（当前 '+s.ep+'）</button>'+
      '<button class="btn" data-m="poster">🖼️ 换海报（手动填图片链接）</button>'+
      (s.status==='done'
        ? '<button class="btn" data-m="resume">▶️ 改回“在追”</button>'
        : '<button class="btn" data-m="done">🎉 标记看完</button>')+
      '<button class="btn danger" data-m="del">🗑️ 删除这部剧</button>'+
      '</div>';
    editDialog.showModal();
  }
  editBody.addEventListener('click', e=>{
    const b=e.target.closest('button'); if(!b) return;
    const m=b.dataset.m, s=editTarget; if(!s) return;
    if(m==='setep'){
      editMode='setep';
      editTitle.textContent='设置集数';
      editBody.innerHTML='<input type="number" id="epInput" min="0" max="9999" value="'+s.ep+'" inputmode="numeric">';
      setTimeout(()=>$('epInput').focus(),50);
    }else if(m==='poster'){
      editMode='poster';
      editTitle.textContent='换海报';
      editBody.innerHTML='<input type="text" id="posterInput" placeholder="粘贴图片链接（https://…）" value="'+escAttr(s.poster||'')+'" autocomplete="off">'+
        '<div class="hint">也可以先在设置里填 TMDB Key，添加新剧时自动配海报。</div>';
      setTimeout(()=>$('posterInput').focus(),50);
    }else if(m==='done'){ s.status='done'; touch(s.id); editDialog.close(); render(); toast('《'+s.name+'》已标记看完 🎉'); }
    else if(m==='resume'){ s.status='watching'; touch(s.id); editDialog.close(); render(); }
    else if(m==='del'){
      if(confirm('确定删除《'+s.name+'》吗？记录会清空。')){
        state.shows=state.shows.filter(x=>x.id!==s.id); saveState(state);
        editDialog.close(); render(); toast('已删除《'+s.name+'》');
      }
    }
  });
  $('editCancel').addEventListener('click', ()=>editDialog.close());
  $('editConfirm').addEventListener('click', ()=>{
    const s=editTarget; if(!s) return;
    if(editMode==='setep'){
      const v=parseInt($('epInput').value,10);
      if(!isNaN(v)&&v>=0&&v<=9999){ s.ep=v; s.status='watching'; touch(s.id); }
    }else if(editMode==='poster'){
      s.poster=$('posterInput').value.trim(); touch(s.id);
    }
    editDialog.close(); render();
  });

  /* ---- 添加新剧 ---- */
  const addDialog=$('addDialog'), newName=$('newName'), searchResults=$('searchResults'), noKeyHint=$('noKeyHint');
  let pickedPoster='';
  $('addBtn').addEventListener('click', ()=>{
    newName.value=''; searchResults.innerHTML=''; pickedPoster=''; noKeyHint.style.display='none';
    addDialog.showModal(); setTimeout(()=>newName.focus(),50);
  });
  $('addCancel').addEventListener('click', ()=>addDialog.close());
  $('goSettings').addEventListener('click', e=>{ e.preventDefault(); addDialog.close(); openSettings(); });
  async function tmdbSearch(name){
    const key=state.tmdbKey.trim(); if(!key) return null;
    const url='https://api.themoviedb.org/3/search/tv?api_key='+encodeURIComponent(key)+
      '&query='+encodeURIComponent(name)+'&language=zh-CN&page=1&include_adult=false';
    const r=await fetch(url);
    if(!r.ok) throw new Error('TMDB 返回 '+r.status);
    const j=await r.json();
    return (j.results||[]).slice(0,6).map(x=>({
      name:x.name||x.original_name||'',
      date:x.first_air_date||'',
      poster:x.poster_path?('https://image.tmdb.org/t/p/w342'+x.poster_path):''
    }));
  }
  $('searchPosterBtn').addEventListener('click', async ()=>{
    const name=normName(newName.value);
    if(!name){ toast('先输入剧名'); return; }
    if(!state.tmdbKey.trim()){ noKeyHint.style.display='block'; searchResults.innerHTML=''; return; }
    noKeyHint.style.display='none';
    searchResults.innerHTML='<div class="hint">搜索中…</div>';
    try{
      const rs=await tmdbSearch(name);
      if(!rs.length){ searchResults.innerHTML='<div class="hint">没搜到，换个名字试试，或直接添加以后手动换海报。</div>'; return; }
      pickedPoster='';
      searchResults.innerHTML=rs.map((r,i)=>
        '<div class="sr-item" data-i="'+i+'">'+
        (r.poster?'<img src="'+escAttr(r.poster)+'" loading="lazy" alt="">':'<div class="poster ph" style="width:100%">🎬</div>')+
        '<div class="t">'+escapeHtml(r.name)+(r.date?'<br>'+escapeHtml(r.date.slice(0,4)):'')+'</div></div>').join('');
    }catch(err){ searchResults.innerHTML='<div class="hint">搜索失败：'+escapeHtml(err.message)+'。检查 Key 是否正确，或稍后再试。</div>'; }
  });
  searchResults.addEventListener('click', async e=>{
    const it=e.target.closest('.sr-item'); if(!it) return;
    searchResults.querySelectorAll('.sr-item').forEach(x=>x.classList.remove('sel'));
    it.classList.add('sel');
    const items=searchResults.querySelectorAll('.sr-item');
    const idx=Array.prototype.indexOf.call(items,it);
    // 重新取一次搜索结果对应项的海报
    const name=normName(newName.value);
    try{
      const rs=await tmdbSearch(name);
      if(rs[idx]){ pickedPoster=rs[idx].poster; if(rs[idx].name) newName.value=rs[idx].name; }
    }catch(err){}
  });
  $('addConfirm').addEventListener('click', ()=>{
    const name=normName(newName.value);
    if(!name){ toast('剧名不能为空'); return; }
    if(findShow(state,name)){ toast('《'+name+'》已经在追了'); addDialog.close(); return; }
    state.shows.unshift({ id:uid(), name, ep:0, status:'watching', poster:pickedPoster, updatedAt:Date.now() });
    saveState(state); addDialog.close(); render();
    toast('已添加《'+name+'》', 2200);
  });

  /* ---- 设置（TMDB Key） ---- */
  const settingsDialog=$('settingsDialog');
  function openSettings(){ $('tmdbKey').value=state.tmdbKey||''; settingsDialog.showModal(); }
  $('settingsBtn').addEventListener('click', openSettings);
  $('settingsCancel').addEventListener('click', ()=>settingsDialog.close());
  $('settingsSave').addEventListener('click', ()=>{
    state.tmdbKey=$('tmdbKey').value.trim(); saveState(state);
    settingsDialog.close(); toast('已保存');
  });

  /* ---- 快捷指令入口：解析 URL 参数并执行 ---- */
  function handleActionParams(){
    const p=parseActionParams(window.location.search);
    if(!p) return;
    const msg=applyAction(state,p);
    render();
    toast(msg, 4200);
    // 清掉参数，避免刷新重复执行
    try{ history.replaceState(null,'',window.location.pathname); }catch(e){}
  }

  render();
  handleActionParams();
})();
}
</script>
</body>
</html>
